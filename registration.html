<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="container">
        <div class="form-container shadow-lg p-4">
            <h2 class="text-center mb-4">Регистрация</h2>
            <form>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Имя пользователя" required>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Почта" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Пароль" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Повторите пароль" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
