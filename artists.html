<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        function getQueryParams() {
            let params = new URLSearchParams(window.location.search);
            return {
                name: params.get("name"),
                year: params.get("year"),
                genre: params.get("genre"),
                country: params.get("country"),
                album: params.get("album"),
                top_song: params.get("top_song"),
                awards: params.get("awards"),
                biography: params.get("biography"),
                image: params.get("image")
            };
        }

        document.addEventListener("DOMContentLoaded", function () {
            let artist = getQueryParams();
            console.log("Полученные параметры:", artist);

            if (!artist.name) {
                document.getElementById("artist-container").innerHTML = `
                    <div class="card shadow-lg p-5 mx-auto text-center" style="max-width: 90vw; height: 50vh;">
                        <h2 class='text-danger'>❌ Артист не найден!</h2>
                    </div>
                `;
                return;
            }

            document.getElementById("artist-container").innerHTML = `
                <div class="card shadow-lg p-4 mx-auto d-flex align-items-center" style="max-width: 90vw; height: 50vh;">
                    <div class="row g-0 w-100 align-items-stretch">
                        <!-- Левая часть: Текст (Растянут по ширине) -->
                        <div class="col-md-8 p-5 d-flex flex-column justify-content-center">
                            <h2 class="text-primary">🎵 ${artist.name} 🎵</h2>
                            <p><strong>Год:</strong> ${artist.year}</p>
                            <p><strong>Жанр:</strong> ${artist.genre}</p>
                            <p><strong>Страна:</strong> ${artist.country}</p>
                            <p><strong>Альбом:</strong> ${artist.album}</p>
                            <p><strong>Лучший трек:</strong> ${artist.top_song}</p>
                            <p><strong>Награды:</strong> ${artist.awards}</p>
                            <p><strong>Биография:</strong> ${decodeURIComponent(artist.biography)}</p>
                        </div>
                        <!-- Правая часть: Фото (Подстраивается под высоту карточки) -->
                        <div class="col-md-4 d-flex align-items-center justify-content-center">
                            <img src="${artist.image}" class="img-fluid rounded shadow-lg" style="max-width: 100%; max-height: 90%;">
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</head>
<body class="bg-light"> <!-- Наследует цвет из styles.css -->

    <!-- Контейнер с информацией об артисте -->
    <div class="container-fluid mt-5">
        <div id="artist-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
